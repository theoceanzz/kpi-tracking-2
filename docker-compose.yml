version: '3.8'

services:
  frontend2:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend2
    restart: unless-stopped
    networks:
      - app-network2
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend2.rule=Host(`keylearn.vn`)"
      - "traefik.http.routers.frontend2.entrypoints=https"
      - "traefik.http.routers.frontend2.tls=true"
      - "traefik.http.routers.frontend2.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend2.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod

      # Database
      - DB_URL=jdbc:postgresql://kpitracking-db-2:5432/kpitracking2
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-123456}

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-9000000}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-604800000}

      # App
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - APP_FRONTEND_URL=${FRONTEND_URL:-https://keylearn.vn}

      # Cloudinary
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

      # Mail
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}

      # AI
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL}

      # Rate limit
      - RATE_LIMIT_LOGIN=${RATE_LIMIT_LOGIN:-5}
      - RATE_LIMIT_EMAIL=${RATE_LIMIT_EMAIL:-3}

    depends_on:
      kpitracking-db-2:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app-network2
      - coolify

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend2.rule=(Host(`keylearn.vn`) && PathPrefix(`/api`))"
      - "traefik.http.routers.backend2.entrypoints=https"
      - "traefik.http.routers.backend2.tls=true"
      - "traefik.http.routers.backend2.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend2.loadbalancer.server.port=8082"
      - "traefik.docker.network=coolify"

  kpitracking-db-2:
    image: postgres:15-alpine

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: kpitracking2
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}

    volumes:
      - postgres_data_2:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d kpitracking2"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - app-network2

networks:
  app-network2:
    driver: bridge

  coolify:
    external: true

volumes:
  postgres_data_2:
